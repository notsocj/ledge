<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- Dusk sky: deep at the top, lighter toward the horizon. -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D1829"/>
      <stop offset="0.55" stop-color="#1D3860"/>
      <stop offset="1" stop-color="#43689A"/>
    </linearGradient>
    <linearGradient id="bird" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF8EF"/>
      <stop offset="1" stop-color="#E6D5C1"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.56" r="0.42">
      <stop offset="0" stop-color="#8FB2DA" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8FB2DA" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#040810" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- macOS icon grid: an 824pt rounded square centred on a 1024 canvas. -->
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#sky)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <!-- The notch, hanging from the top edge with the real one's flared shoulders. -->
    <path d="M356 100 Q 388 100 388 132 L 388 148 Q 388 188 428 188 L 596 188 Q 636 188 636 148 L 636 132 Q 636 100 668 100 Z" fill="#000000"/>
  </g>
  <!-- The kestrel, hovering just under the notch. -->
  <path transform="translate(179 216) scale(1.3)" filter="url(#lift)" fill="url(#bird)" d="M256 152 C 268 152 276 161 276 172 C 276 181 272 187 267 191 L 276 202 C 330 188 410 156 480 116 C 452 196 368 266 282 292 L 276 326 L 292 404 Q 256 414 220 404 L 236 326 L 230 292 C 144 266 60 196 32 116 C 102 156 182 188 236 202 L 245 191 C 240 187 236 181 236 172 C 236 161 244 152 256 152 Z"/>
</svg>
