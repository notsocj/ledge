name: Windows

on:
  push:
    paths: ['windows/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['windows/**', '.github/workflows/windows.yml']

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet publish windows/Ledge -c Release -r ${{ matrix.rid }} --self-contained -p:PublishSingleFile=true -o out
      - uses: actions/upload-artifact@v4
        with:
          name: Ledge-${{ matrix.rid }}
          path: out/Ledge.exe
